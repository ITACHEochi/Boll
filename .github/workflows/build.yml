name: Build APK (Kivy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.10

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk wget

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Setup Android SDK manually
      run: |
        mkdir -p $HOME/android-sdk
        echo "export ANDROIDSDK=$HOME/android-sdk" >> $GITHUB_ENV

    - name: Accept licenses properly
      run: |
        yes | sdkmanager --licenses || true || exit 0

    - name: Build APK
      run: |
        buildozer -v android debug
